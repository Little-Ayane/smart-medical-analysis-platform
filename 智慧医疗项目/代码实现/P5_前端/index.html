<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智慧医疗大数据与AI大模型分析平台</title>
  <!-- Vue 3 + ECharts CDN -->
  <script src="https://unpkg.com/vue@3.4.38/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Microsoft YaHei", sans-serif; background: #f0f4f8; }
    #app { max-width: 1000px; margin: 20px auto; display: flex; flex-direction: column; height: 92vh; }
    .header { background: #1e6fd9; color: #fff; padding: 16px 20px; border-radius: 8px 8px 0 0; }
    .chat-body { flex: 1; overflow-y: auto; background: #fff; padding: 16px; border: 1px solid #e0e0e0; }
    .msg { margin-bottom: 16px; display: flex; }
    .msg.user { justify-content: flex-end; }
    .bubble { max-width: 70%; padding: 10px 14px; border-radius: 10px; line-height: 1.6; }
    .msg.user .bubble { background: #1e6fd9; color: #fff; }
    .msg.bot .bubble { background: #f2f6fb; color: #333; }
    .chart-box { width: 100%; height: 320px; margin-top: 8px; }
    .input-bar { display: flex; padding: 12px; background: #fff; border: 1px solid #e0e0e0; border-top: none; }
    .input-bar input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    .input-bar button { margin-left: 10px; padding: 0 22px; background: #1e6fd9; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    .meta { color: #999; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
<div id="app">
  <div class="header"><h2>🏥 智慧医疗大数据与AI大模型分析平台</h2></div>

  <div class="chat-body" ref="chatBody">
    <div v-for="(m, i) in messages" :key="i" class="msg" :class="m.role">
      <div class="bubble">
        <div v-html="m.text"></div>
        <div v-if="m.chart" class="chart-box" :ref="'chart_' + i"></div>
        <div v-if="m.meta" class="meta">耗时 {{ m.meta.query_ms }}ms · 分析记录 {{ m.meta.total_records }} 条</div>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <input v-model="question" placeholder="试试问：2021年哪类疾病的平均住院时长最长？" @keyup.enter="send" />
    <button @click="send">发送</button>
  </div>
</div>

<script>
const { createApp, ref, nextTick } = Vue;

createApp({
  setup() {
    const question = ref("");
    const messages = ref([
      { role: "bot", text: "您好！我是医疗数据分析助手，请用自然语言提问，我将为您分析住院患者数据。" }
    ]);
    const chatBody = ref(null);

    // 调用 P4 AI 后端（此处为代理地址，实际部署指向 Flask AI 服务）
    const AI_API = "http://127.0.0.1:5001/api/chat";

    async function send() {
      const q = question.value.trim();
      if (!q) return;
      messages.value.push({ role: "user", text: q });
      question.value = "";

      try {
        const resp = await fetch(AI_API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q })
        });
        const data = await resp.json();
        messages.value.push({
          role: "bot",
          text: data.answer.replace(/\n/g, "<br/>"),
          chart: data.chart,
          meta: data.meta
        });
        await nextTick();
        renderCharts();
      } catch (e) {
        messages.value.push({ role: "bot", text: "⚠️ 请求失败，请检查服务是否启动：" + e.message });
      }
      scrollBottom();
    }

    // 为每条带 chart 的消息渲染 ECharts
    function renderCharts() {
      messages.value.forEach((m, i) => {
        if (!m.chart) return;
        const el = document.querySelector(`[ref="chart_${i}"]`) || null;
        // 用更稳健的方式获取容器
      });
    }

    function scrollBottom() {
      nextTick(() => {
        const el = chatBody.value;
        if (el) el.scrollTop = el.scrollHeight;
      });
    }

    return { question, messages, chatBody, send };
  }
}).mount("#app");
</script>
</body>
</html>
