<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRG分析看板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f5f5; padding: 20px; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { padding: 10px 20px; background: #fff; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .tab:hover { border-color: #667eea; }
        .tab.active { background: #667eea; color: #fff; border-color: #667eea; }
        .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .card h2 { color: #333; margin-bottom: 15px; font-size: 18px; border-left: 4px solid #667eea; padding-left: 10px; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        select, input, button { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        button { background: #667eea; color: #fff; cursor: pointer; border: none; }
        button:hover { background: #5a6fd6; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; color: #555; }
        tr:hover { background: #f0f4ff; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: 500; }
        .badge-high { background: #fee2e2; color: #dc2626; }
        .badge-medium { background: #fef3c7; color: #d97706; }
        .badge-low { background: #d1fae5; color: #059669; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; padding: 20px; border-radius: 12px; }
        .stat-card h3 { font-size: 14px; opacity: 0.9; margin-bottom: 5px; }
        .stat-card .value { font-size: 28px; font-weight: bold; }
        .loading { text-align: center; padding: 40px; color: #999; }
        .progress-bar { height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: #667eea; transition: width 0.3s; }
        .chart-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .chart-item { flex: 1; min-width: 300px; }
        .bar-chart { display: flex; flex-direction: column; gap: 8px; }
        .bar-item { display: flex; align-items: center; gap: 10px; }
        .bar-label { width: 120px; font-size: 12px; text-align: right; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bar { height: 24px; background: #667eea; border-radius: 4px; min-width: 2px; transition: width 0.5s; }
        .bar-value { font-size: 12px; color: #333; min-width: 60px; }
        .hidden { display: none; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 DRG分析看板</h1>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('overview')">📊 总览</div>
            <div class="tab" onclick="switchTab('cost')">💰 费用排名</div>
            <div class="tab" onclick="switchTab('stay')">📅 住院天数</div>
            <div class="tab" onclick="switchTab('risk')">⚠️ 死亡风险</div>
            <div class="tab" onclick="switchTab('cmi')">📈 CMI排名</div>
            <div class="tab" onclick="switchTab('outlier')">🔍 离群识别</div>
        </div>

        <!-- 总览 -->
        <div id="overview" class="content">
            <div class="stats" id="summary-stats">
                <div class="stat-card"><h3>总DRG数</h3><div class="value" id="total-drg">-</div></div>
                <div class="stat-card"><h3>总病例数</h3><div class="value" id="total-cases">-</div></div>
                <div class="stat-card"><h3>平均住院天数</h3><div class="value" id="avg-stay">-</div></div>
            </div>
            <div class="grid-2">
                <div class="card">
                    <h2>死亡风险分布</h2>
                    <div id="risk-chart" class="bar-chart"></div>
                </div>
                <div class="card">
                    <h2>严重程度分布</h2>
                    <div id="severity-chart" class="bar-chart"></div>
                </div>
            </div>
        </div>

        <!-- 费用排名 -->
        <div id="cost" class="content hidden">
            <div class="card">
                <h2>DRG费用排名</h2>
                <div class="controls">
                    <select id="cost-limit">
                        <option value="10">Top 10</option>
                        <option value="20" selected>Top 20</option>
                        <option value="50">Top 50</option>
                    </select>
                    <button onclick="loadCostRanking()">查询</button>
                </div>
                <table>
                    <thead><tr><th>排名</th><th>DRG编码</th><th>DRG描述</th><th>MDC</th><th>病例数</th><th>平均费用</th><th>费用分布</th></tr></thead>
                    <tbody id="cost-table"></tbody>
                </table>
            </div>
        </div>

        <!-- 住院天数 -->
        <div id="stay" class="content hidden">
            <div class="card">
                <h2>住院天数对比</h2>
                <div class="controls">
                    <select id="stay-group">
                        <option value="drg">按DRG</option>
                        <option value="diagnosis">按诊断</option>
                        <option value="severity">按严重程度</option>
                        <option value="mdc">按MDC</option>
                    </select>
                    <select id="stay-limit">
                        <option value="10">Top 10</option>
                        <option value="20" selected>Top 20</option>
                    </select>
                    <button onclick="loadStayComparison()">查询</button>
                </div>
                <table>
                    <thead><tr><th>排名</th><th>分组</th><th>平均住院天数</th><th>最大住院天数</th><th>病例数</th><th>天数分布</th></tr></thead>
                    <tbody id="stay-table"></tbody>
                </table>
            </div>
        </div>

        <!-- 死亡风险 -->
        <div id="risk" class="content hidden">
            <div class="card">
                <h2>死亡风险对比</h2>
                <div class="controls">
                    <select id="risk-group">
                        <option value="risk_mortality">按死亡风险</option>
                        <option value="severity">按严重程度</option>
                        <option value="mdc">按MDC</option>
                    </select>
                    <button onclick="loadMortalityRisk()">查询</button>
                </div>
                <table>
                    <thead><tr><th>分组</th><th>病例数</th><th>占比</th><th>平均费用</th><th>平均住院天数</th></tr></thead>
                    <tbody id="risk-table"></tbody>
                </table>
            </div>
        </div>

        <!-- CMI排名 -->
        <div id="cmi" class="content hidden">
            <div class="card">
                <h2>CMI排名 (病例组合指数)</h2>
                <div class="controls">
                    <select id="cmi-group">
                        <option value="drg">按DRG</option>
                        <option value="mdc">按MDC</option>
                        <option value="hospital">按医院</option>
                    </select>
                    <select id="cmi-limit">
                        <option value="10">Top 10</option>
                        <option value="20" selected>Top 20</option>
                    </select>
                    <button onclick="loadCMIRanking()">查询</button>
                </div>
                <table>
                    <thead><tr><th>排名</th><th>分组</th><th>病例数</th><th>平均费用</th><th>CMI</th><th>CMI分布</th></tr></thead>
                    <tbody id="cmi-table"></tbody>
                </table>
            </div>
        </div>

        <!-- 离群识别 -->
        <div id="outlier" class="content hidden">
            <div class="card">
                <h2>离群识别</h2>
                <div class="controls">
                    <select id="outlier-metric">
                        <option value="avg_charges">平均费用</option>
                        <option value="avg_stay">平均住院天数</option>
                    </select>
                    <select id="outlier-group">
                        <option value="drg">按DRG</option>
                        <option value="diagnosis">按诊断</option>
                        <option value="hospital">按医院</option>
                    </select>
                    <select id="outlier-method">
                        <option value="iqr">IQR方法</option>
                        <option value="zscore">Z分数</option>
                    </select>
                    <button onclick="loadOutlierDetection()">查询</button>
                </div>
                <div class="stats" id="outlier-stats"></div>
                <table>
                    <thead><tr><th>类型</th><th>分组</th><th>指标值</th><th>偏差</th><th>病例数</th></tr></thead>
                    <tbody id="outlier-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8001/api/v1/drg';

        // 工具函数
        function formatNumber(n) {
            if (n === null || n === undefined) return '-';
            return Number(n).toLocaleString('zh-CN');
        }
        function formatMoney(n) {
            if (n === null || n === undefined) return '-';
            return '$' + Number(n).toLocaleString('zh-CN', {maximumFractionDigits: 0});
        }
        function truncate(str, len) {
            if (!str) return '-';
            return str.length > len ? str.substring(0, len) + '...' : str;
        }

        // 切换标签
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.add('hidden'));
            event.target.classList.add('active');
            document.getElementById(tab).classList.remove('hidden');
        }

        // 加载总览数据
        async function loadSummary() {
            try {
                const res = await fetch(`${API_BASE}/summary`);
                const data = await res.json();
                if (data.code === 200) {
                    const d = data.data;
                    document.getElementById('total-drg').textContent = formatNumber(d.total_drg);
                    document.getElementById('total-cases').textContent = formatNumber(d.total_cases);
                    document.getElementById('avg-stay').textContent = d.avg_stay + '天';

                    // 风险分布图
                    renderBarChart('risk-chart', d.risk_distribution.map(r => ({
                        label: r.risk || '未知',
                        value: r.cases,
                        percentage: r.percentage
                    })));

                    // 严重程度分布图
                    renderBarChart('severity-chart', d.severity_distribution.map(r => ({
                        label: r.severity || '未知',
                        value: r.cases,
                        percentage: r.percentage
                    })));
                }
            } catch (e) { console.error('加载总览失败:', e); }
        }

        // 渲染条形图
        function renderBarChart(containerId, data) {
            const container = document.getElementById(containerId);
            const maxVal = Math.max(...data.map(d => d.value));
            container.innerHTML = data.map(d => `
                <div class="bar-item">
                    <div class="bar-label">${d.label}</div>
                    <div class="progress-bar" style="flex:1">
                        <div class="progress-fill" style="width:${(d.value/maxVal*100)}%"></div>
                    </div>
                    <div class="bar-value">${formatNumber(d.value)} (${d.percentage}%)</div>
                </div>
            `).join('');
        }

        // 加载费用排名
        async function loadCostRanking() {
            const limit = document.getElementById('cost-limit').value;
            try {
                const res = await fetch(`${API_BASE}/cost-ranking`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({limit: parseInt(limit)})
                });
                const data = await res.json();
                if (data.code === 200) {
                    const maxCost = Math.max(...data.data.rows.map(r => parseFloat(r.avg_charges)));
                    document.getElementById('cost-table').innerHTML = data.data.rows.map((r, i) => `
                        <tr>
                            <td><strong>${i+1}</strong></td>
                            <td>${r.drg_code}</td>
                            <td title="${r.drg_desc}">${truncate(r.drg_desc, 40)}</td>
                            <td>${r.mdc_desc ? truncate(r.mdc_desc, 20) : '-'}</td>
                            <td>${formatNumber(r.cases)}</td>
                            <td>${formatMoney(r.avg_charges)}</td>
                            <td><div class="progress-bar"><div class="progress-fill" style="width:${(parseFloat(r.avg_charges)/maxCost*100)}%"></div></div></td>
                        </tr>
                    `).join('');
                }
            } catch (e) { console.error('加载费用排名失败:', e); }
        }

        // 加载住院天数对比
        async function loadStayComparison() {
            const groupBy = document.getElementById('stay-group').value;
            const limit = document.getElementById('stay-limit').value;
            try {
                const res = await fetch(`${API_BASE}/stay-comparison`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({group_by: groupBy, limit: parseInt(limit)})
                });
                const data = await res.json();
                if (data.code === 200) {
                    const maxStay = Math.max(...data.data.rows.map(r => r.avg_stay || 0));
                    document.getElementById('stay-table').innerHTML = data.data.rows.map((r, i) => {
                        const name = r.drg_desc || r.diagnosis_desc || r.severity_desc || r.mdc_desc || '-';
                        return `
                        <tr>
                            <td><strong>${i+1}</strong></td>
                            <td title="${name}">${truncate(name, 35)}</td>
                            <td>${(r.avg_stay || 0).toFixed(1)}天</td>
                            <td>${r.max_stay || '-'}天</td>
                            <td>${formatNumber(r.cases)}</td>
                            <td><div class="progress-bar"><div class="progress-fill" style="width:${((r.avg_stay||0)/maxStay*100)}%"></div></div></td>
                        </tr>`;
                    }).join('');
                }
            } catch (e) { console.error('加载住院天数失败:', e); }
        }

        // 加载死亡风险对比
        async function loadMortalityRisk() {
            const groupBy = document.getElementById('risk-group').value;
            try {
                const res = await fetch(`${API_BASE}/mortality-risk`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({group_by: groupBy})
                });
                const data = await res.json();
                if (data.code === 200) {
                    document.getElementById('risk-table').innerHTML = data.data.rows.map(r => {
                        const name = r.risk_mortality || r.severity_desc || r.mdc_desc || r.drg_desc || '-';
                        const p = r.percentage || 0;
                        const badgeClass = p > 30 ? 'badge-high' : p > 15 ? 'badge-medium' : 'badge-low';
                        return `
                        <tr>
                            <td><span class="badge ${badgeClass}">${name}</span></td>
                            <td>${formatNumber(r.cases)}</td>
                            <td><strong>${p}%</strong></td>
                            <td>${formatMoney(r.avg_charges)}</td>
                            <td>${(r.avg_stay || 0).toFixed(1)}天</td>
                        </tr>`;
                    }).join('');
                }
            } catch (e) { console.error('加载死亡风险失败:', e); }
        }

        // 加载CMI排名
        async function loadCMIRanking() {
            const groupBy = document.getElementById('cmi-group').value;
            const limit = document.getElementById('cmi-limit').value;
            try {
                const res = await fetch(`${API_BASE}/cmi-ranking`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({group_by: groupBy, limit: parseInt(limit)})
                });
                const data = await res.json();
                if (data.code === 200) {
                    const maxCMI = Math.max(...data.data.rows.map(r => r.cmi || 0));
                    document.getElementById('cmi-table').innerHTML = data.data.rows.map((r, i) => {
                        const name = r.drg_desc || r.mdc_desc || r.hospital_name || '-';
                        return `
                        <tr>
                            <td><strong>${i+1}</strong></td>
                            <td title="${name}">${truncate(name, 35)}</td>
                            <td>${formatNumber(r.cases)}</td>
                            <td>${formatMoney(r.avg_charges)}</td>
                            <td><strong>${(r.cmi || 0).toFixed(2)}</strong></td>
                            <td><div class="progress-bar"><div class="progress-fill" style="width:${((r.cmi||0)/maxCMI*100)}%"></div></div></td>
                        </tr>`;
                    }).join('');
                }
            } catch (e) { console.error('加载CMI排名失败:', e); }
        }

        // 加载离群识别
        async function loadOutlierDetection() {
            const metric = document.getElementById('outlier-metric').value;
            const groupBy = document.getElementById('outlier-group').value;
            const method = document.getElementById('outlier-method').value;
            try {
                const res = await fetch(`${API_BASE}/outlier-detection`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({metric, group_by: groupBy, method, limit: 20})
                });
                const data = await res.json();
                if (data.code === 200) {
                    const d = data.data;
                    document.getElementById('outlier-stats').innerHTML = `
                        <div class="stat-card"><h3>离群数</h3><div class="value">${d.outlier_count}</div></div>
                        <div class="stat-card"><h3>正常数</h3><div class="value">${d.normal_count}</div></div>
                        <div class="stat-card"><h3>均值</h3><div class="value">${formatMoney(d.statistics.mean)}</div></div>
                        <div class="stat-card"><h3>中位数</h3><div class="value">${formatMoney(d.statistics.median)}</div></div>
                    `;
                    document.getElementById('outlier-table').innerHTML = d.outliers.map(r => {
                        const name = r.drg_desc || r.diagnosis_desc || r.hospital_name || '-';
                        const isHigh = r.outlier_type === 'high';
                        return `
                        <tr>
                            <td><span class="badge ${isHigh ? 'badge-high' : 'badge-low'}">${isHigh ? '偏高' : '偏低'}</span></td>
                            <td title="${name}">${truncate(name, 35)}</td>
                            <td>${formatMoney(r[metric] || r.avg_charges || r.avg_stay)}</td>
                            <td>${formatMoney(r.deviation)}</td>
                            <td>${formatNumber(r.cases)}</td>
                        </tr>`;
                    }).join('');
                }
            } catch (e) { console.error('加载离群识别失败:', e); }
        }

        // 初始化
        loadSummary();
    </script>
</body>
</html>
