<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧医疗数据分析平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #333;
            font-size: 1.3em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .stat-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #333;
            font-size: 1.5em;
            font-weight: bold;
        }

        .stat-value.highlight {
            color: #667eea;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .bar-container {
            width: 100%;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            height: 25px;
        }

        .bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            transition: width 1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8em;
            font-weight: bold;
        }

        .pivot-table {
            overflow-x: auto;
        }

        .pivot-table td {
            text-align: center;
            min-width: 100px;
        }

        .pivot-table .row-header {
            font-weight: bold;
            background: #f8f9fa;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 50px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            display: block;
            margin: 20px auto;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .chart-container {
            position: relative;
            height: 200px;
            margin-top: 15px;
        }

        .pie-chart {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            position: relative;
        }

        .pie-slice {
            position: absolute;
            width: 100%;
            height: 100%;
            clip: rect(0, 200px, 200px, 100px);
        }

        .pie-slice::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            clip: rect(0, 100px, 200px, 0);
            border-radius: 50%;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .tab.active, .tab:hover {
            background: white;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 智慧医疗数据分析平台</h1>

        <div class="tabs">
            <button class="tab active" onclick="loadAll()">📊 总览</button>
            <button class="tab" onclick="loadByArea()">🗺️ 区域分析</button>
            <button class="tab" onclick="loadByAge()">👥 年龄分析</button>
            <button class="tab" onclick="loadPivot()">📋 透视分析</button>
        </div>

        <button class="refresh-btn" onclick="loadAll()">🔄 刷新数据</button>

        <div id="content">
            <div class="loading">加载中...</div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api/v1/analysis';

        async function fetchAPI(endpoint, data = null) {
            const options = {
                method: data ? 'POST' : 'GET',
                headers: { 'Content-Type': 'application/json' },
            };
            if (data) options.body = JSON.stringify(data);

            const response = await fetch(`${API_BASE}${endpoint}`, options);
            return response.json();
        }

        function formatNumber(num) {
            return new Intl.NumberFormat('zh-CN').format(num);
        }

        function formatMoney(num) {
            return '$' + new Intl.NumberFormat('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num);
        }

        async function loadAll() {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab')[0].classList.add('active');

            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">加载数据中...</div>';

            try {
                // 加载汇总数据
                const summary = await fetchAPI('/summary', {
                    metrics: ['cases', 'total_charges', 'total_costs', 'avg_stay'],
                    filters: { year: 2021 }
                });

                // 加载区域数据
                const areaData = await fetchAPI('/dimension-combine', {
                    dimensions: ['hospital_area'],
                    metrics: ['cases', 'total_charges'],
                    filters: { year: 2021 },
                    sort: { field: 'cases', order: 'desc' },
                    limit: 5
                });

                // 加载年龄数据
                const ageData = await fetchAPI('/dimension-combine', {
                    dimensions: ['age_group'],
                    metrics: ['cases', 'avg_charges'],
                    filters: { year: 2021 }
                });

                const totalCases = summary.data.cases;
                const totalCharges = parseFloat(summary.data.total_charges);
                const totalCosts = parseFloat(summary.data.total_costs);
                const avgStay = parseFloat(summary.data.avg_stay);

                let html = `
                    <div class="cards">
                        <div class="card">
                            <h2>📊 总体统计</h2>
                            <div class="stat-grid">
                                <div class="stat-item">
                                    <div class="stat-label">总病例数</div>
                                    <div class="stat-value highlight">${formatNumber(totalCases)}</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">总费用</div>
                                    <div class="stat-value">${formatMoney(totalCharges)}</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">总成本</div>
                                    <div class="stat-value">${formatMoney(totalCosts)}</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">平均住院天数</div>
                                    <div class="stat-value">${avgStay.toFixed(2)} 天</div>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <h2>💰 费用分析</h2>
                            <div class="stat-grid">
                                <div class="stat-item">
                                    <div class="stat-label">平均每例费用</div>
                                    <div class="stat-value">${formatMoney(totalCharges / totalCases)}</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">成本收益率</div>
                                    <div class="stat-value">${((totalCosts / totalCharges) * 100).toFixed(1)}%</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">日均费用</div>
                                    <div class="stat-value">${formatMoney(totalCharges / totalCases / avgStay)}</div>
                                </div>
                                <div class="stat-item">
                                    <div class="stat-label">利润率</div>
                                    <div class="stat-value">${(((totalCharges - totalCosts) / totalCharges) * 100).toFixed(1)}%</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="cards">
                        <div class="card">
                            <h2>🗺️ 区域分布 Top 5</h2>
                            <table>
                                <thead>
                                    <tr>
                                        <th>区域</th>
                                        <th>病例数</th>
                                        <th>占比</th>
                                    </tr>
                                </thead>
                                <tbody>`;

                areaData.data.rows.forEach(row => {
                    const cases = row.cases;
                    const percentage = ((cases / totalCases) * 100).toFixed(1);
                    html += `
                        <tr>
                            <td>${row.hospital_area}</td>
                            <td>${formatNumber(cases)}</td>
                            <td>
                                <div class="bar-container">
                                    <div class="bar" style="width: ${percentage}%">${percentage}%</div>
                                </div>
                            </td>
                        </tr>`;
                });

                html += `
                                </tbody>
                            </table>
                        </div>

                        <div class="card">
                            <h2>👥 年龄分布</h2>
                            <table>
                                <thead>
                                    <tr>
                                        <th>年龄段</th>
                                        <th>病例数</th>
                                        <th>平均费用</th>
                                    </tr>
                                </thead>
                                <tbody>`;

                ageData.data.rows.forEach(row => {
                    html += `
                        <tr>
                            <td>${row.age_group}</td>
                            <td>${formatNumber(row.cases)}</td>
                            <td>${formatMoney(parseFloat(row.avg_charges))}</td>
                        </tr>`;
                });

                html += `
                                </tbody>
                            </table>
                        </div>
                    </div>`;

                content.innerHTML = html;

            } catch (error) {
                content.innerHTML = `<div class="error">加载失败: ${error.message}</div>`;
            }
        }

        async function loadByArea() {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab')[1].classList.add('active');

            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">加载区域数据...</div>';

            try {
                const data = await fetchAPI('/dimension-combine', {
                    dimensions: ['hospital_area'],
                    metrics: ['cases', 'total_charges', 'avg_charges', 'avg_stay'],
                    filters: { year: 2021 },
                    sort: { field: 'cases', order: 'desc' }
                });

                let html = `
                    <div class="card">
                        <h2>🗺️ 区域详细分析</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>区域</th>
                                    <th>病例数</th>
                                    <th>总费用</th>
                                    <th>平均费用</th>
                                    <th>平均住院天数</th>
                                </tr>
                            </thead>
                            <tbody>`;

                data.data.rows.forEach(row => {
                    html += `
                        <tr>
                            <td><strong>${row.hospital_area}</strong></td>
                            <td>${formatNumber(row.cases)}</td>
                            <td>${formatMoney(parseFloat(row.total_charges))}</td>
                            <td>${formatMoney(parseFloat(row.avg_charges))}</td>
                            <td>${parseFloat(row.avg_stay).toFixed(2)} 天</td>
                        </tr>`;
                });

                html += `</tbody></table></div>`;
                content.innerHTML = html;

            } catch (error) {
                content.innerHTML = `<div class="error">加载失败: ${error.message}</div>`;
            }
        }

        async function loadByAge() {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab')[2].classList.add('active');

            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">加载年龄数据...</div>';

            try {
                const data = await fetchAPI('/dimension-combine', {
                    dimensions: ['age_group', 'gender'],
                    metrics: ['cases', 'avg_charges'],
                    filters: { year: 2021 }
                });

                let html = `
                    <div class="card">
                        <h2>👥 年龄×性别分析</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>年龄段</th>
                                    <th>性别</th>
                                    <th>病例数</th>
                                    <th>平均费用</th>
                                </tr>
                            </thead>
                            <tbody>`;

                data.data.rows.forEach(row => {
                    html += `
                        <tr>
                            <td>${row.age_group}</td>
                            <td>${row.gender === 'M' ? '男' : row.gender === 'F' ? '女' : '未知'}</td>
                            <td>${formatNumber(row.cases)}</td>
                            <td>${formatMoney(parseFloat(row.avg_charges))}</td>
                        </tr>`;
                });

                html += `</tbody></table></div>`;
                content.innerHTML = html;

            } catch (error) {
                content.innerHTML = `<div class="error">加载失败: ${error.message}</div>`;
            }
        }

        async function loadPivot() {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab')[3].classList.add('active');

            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">加载透视数据...</div>';

            try {
                const data = await fetchAPI('/pivot', {
                    row_dimension: 'age_group',
                    col_dimension: 'gender',
                    metric: 'avg_charges',
                    filters: { year: 2021 }
                });

                let html = `
                    <div class="card">
                        <h2>📋 透视表：年龄段 × 性别 平均费用</h2>
                        <div class="pivot-table">
                            <table>
                                <thead>
                                    <tr>
                                        <th>年龄段</th>`;

                data.data.columns.forEach(col => {
                    html += `<th>${col === 'M' ? '男' : col === 'F' ? '女' : '未知'}</th>`;
                });

                html += `</tr></thead><tbody>`;

                data.data.rows.forEach((row, i) => {
                    html += `<tr><td class="row-header">${row}</td>`;
                    data.data.matrix[i].forEach(val => {
                        html += `<td>${formatMoney(parseFloat(val))}</td>`;
                    });
                    html += `</tr>`;
                });

                html += `</tbody></table></div></div>`;
                content.innerHTML = html;

            } catch (error) {
                content.innerHTML = `<div class="error">加载失败: ${error.message}</div>`;
            }
        }

        // 页面加载时自动加载数据
        window.onload = loadAll;
    </script>
</body>
</html>
